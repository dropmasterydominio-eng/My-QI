.rp-sec{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px}
.rp-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-weight:700;font-size:16px}

.rp-tr{position:relative;height:10px;border-radius:99px;background:var(--tint)}
.rp-tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.rp-tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.rp-lg{font-size:12px;color:var(--muted);margin-top:14px}
.rp-m{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.rp-m div{background:var(--tint);border-radius:16px;padding:12px;text-align:center}.rp-m b{display:block;font-size:22px}.rp-m span{font-size:12px;color:var(--muted)}
.rp-g{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--tone),var(--accent));margin:26px 0 8px}
.rp-g b{position:absolute;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);margin-left:-11px}
.rp-gl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.rp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.rp-chips span{padding:8px 14px;border-radius:99px;background:var(--tint);font-size:13px}
.rp-tl{list-style:none;margin:16px 0 0;padding:0}

.rp-tl li:before{content:attr(data-d);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.rp-tl li:after{content:"";position:absolute;left:15px;top:36px;bottom:2px;width:2px;background:var(--line)}
.rp-tl li:last-child{padding-bottom:4px}.rp-tl li:last-child:after{display:none}
.rp-ft{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 4px;line-height:1.6}
</style>

<body>
<div id="app" aria-live="polite"></div>
<nav class="nav" id="nav" aria-label="Navegação"></nav>

<div class="curtain" id="curtain" aria-hidden="true"><span>pensa</span></div>

<script>
/* ---------- ícones ---------- */
const ic=(d,s=22,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  hour:ic('<path d="M7 3h10M7 21h10M8 3v3.5L12 12l-4 5.5V21M16 3v3.5L12 12l4 5.5V21"/>',16),
  trend:ic('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',18),
  pen:ic('<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/>',18),
  home:ic('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',24),
  test:ic('<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/>',24),
  chart:ic('<path d="M5 20V10M12 20V4M19 20v-7"/>',24),
  grid:ic('<circle cx="6" cy="6" r="1.3"/><circle cx="12" cy="6" r="1.3"/><circle cx="18" cy="6" r="1.3"/><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/><circle cx="6" cy="18" r="1.3"/><circle cx="12" cy="18" r="1.3"/><circle cx="18" cy="18" r="1.3"/>',22),
  watch:ic('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',18),
  check:ic('<path d="M4 12l5 5L20 6"/>',26,2.5)
};

/* ---------- puzzles visuais (SVG) ---------- */
const PATH={
  d:'M12 2 20 12 12 22 4 12Z',
  h:'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.6A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z',
  s:'M12 2c3 4 8 6.5 8 11a4.5 4.5 0 0 1-7 3.7c.2 2 .8 3.6 2 5.3H9c1.2-1.7 1.8-3.3 2-5.3A4.5 4.5 0 0 1 4 13c0-4.5 5-7 8-11z'
};
const sym=(shape,style)=>{
  const card=style==='plain'?'':`<rect x="2" y="2" width="36" height="52" rx="5" fill="${style==='fill'?'currentColor':'none'}" stroke="currentColor" stroke-width="2.5"/>`;
  const f=style==='fill'?'var(--surface)':'currentColor';
  return `<svg viewBox="0 0 40 56">${card}<path transform="translate(8 16)" d="${PATH[shape]}" fill="${f}"/></svg>`;
};
const shp=(c,mark,rot=0)=>{
  const box=c==='c'?'<circle cx="30" cy="30" r="26"':c==='s'?'<rect x="5" y="5" width="50" height="50" rx="7"':'<path d="M30 5 56 54H4z"';
  const b=c==='t'?box+' fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>':box+' fill="none" stroke="currentColor" stroke-width="3"/>';
  const m=mark?`<path d="M30 16v16H14" transform="rotate(${rot} 30 30)" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square"/>`:'';
  return `<svg viewBox="0 0 60 60">${b}${m}</svg>`;
};
const dots=(n,k)=>{
  let o='';
  for(let i=0;i<n;i++){
    const x=36+(i-(n-1)/2)*20, filled=k[1]==='f';
    const p=filled?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="2.5"';
    o+=k[0]==='c'?`<circle cx="${x}" cy="20" r="7" ${p}/>`:`<rect x="${x-7}" y="13" width="14" height="14" rx="2" ${p}/>`;
  }
  return `<svg viewBox="0 0 72 40">${o}</svg>`;
};
const matrix=(cells,cols=3)=>`<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:10px;color:var(--ink)">`+cells.map(c=>c==='?'
  ?'<div style="border:2.5px solid #1C73E8;border-radius:8px;display:grid;place-items:center;font-size:34px;font-weight:800;color:#1C73E8;min-height:64px">?</div>'
  :`<div style="display:grid;place-items:center;min-height:64px;padding:4px">${c}</div>`).join('')+'</div>';
const eq=(rows,ask)=>`<div style="display:grid;gap:12px;font-size:30px;font-weight:700;color:var(--ink)">`+rows.map(r=>`<div style="display:flex;justify-content:center;align-items:center;gap:14px">${r}</div>`).join('')+`<hr style="border:0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:center;align-items:center;gap:14px">${ask}</div></div>`;
const CIR='<svg width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="19" r="18" fill="currentColor"/></svg>';
const TRI='<svg width="40" height="38" viewBox="0 0 40 38"><path d="M20 2 38 36H2z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>';
const SQU='<svg width="38" height="38" viewBox="0 0 38 38"><rect x="1" y="1" width="36" height="36" rx="8" fill="currentColor"/></svg>';
const P='<span style="color:var(--muted)">+</span>', E='<span style="color:var(--muted)">=</span>', Q='<span style="color:#1C73E8">?</span>';

/* ---------- perguntas ---------- */
/* c: categoria · w: peso · a: índice certo · fix: não baralhar */
const BANK=[
 {id:'q1',c:'Lógica',w:1,q:'Um agricultor tem 15 ovelhas. Morrem todas menos 8. Quantas ficam?',o:['7','8','15','0','3'],a:1,fix:1},
 {id:'q2',c:'Lógica',w:1,q:'Ultrapassas a pessoa que está em 3.º lugar. Em que lugar ficas?',o:['1','4','3','2','5'],a:2,fix:1},
 {id:'q3',c:'Lógica',w:1,q:'A Maria é mais alta do que a Ana. A Ana é mais alta do que a Rita. Quem é a mais baixa?',o:['Maria','Ana','Rita','Não se sabe'],a:2},
 {id:'q4',c:'Visual',w:1,q:'Quantos vértices tem um cubo?',o:['6','4','8','5','7'],a:2,fix:1},
 {id:'q5',c:'Numérico',w:1,q:'Que número vem a seguir? 2, 4, 8, 16, __',o:['20','24','30','32','36'],a:3,fix:1},
 {id:'q6',c:'Numérico',w:1,q:'Que número está a faltar? 3, 6, 9, 12, __, 18',o:['13','14','15','16','17'],a:2,fix:1},
 {id:'q7',c:'Numérico',w:2,q:'Descobre o valor do círculo e do triângulo.',viz:()=>eq([CIR+P+CIR+E+'<span>6</span>',CIR+P+TRI+E+'<span>7</span>'],TRI+E+Q),o:['2','3','4','5'],a:2,fix:1},
 {id:'q8',c:'Numérico',w:2,q:'Descobre o valor do círculo.',viz:()=>eq([SQU+P+SQU+P+SQU+E+'<span>12</span>',SQU+P+CIR+E+'<span>9</span>'],CIR+E+Q),o:['3','4','5','6'],a:2,fix:1},
 {id:'v1',c:'Visual',w:2,q:'Quantas formas faltam na última célula?',viz:()=>matrix([dots(1,'cf'),dots(2,'cf'),dots(3,'cf'),dots(1,'co'),dots(2,'co'),dots(3,'co'),dots(1,'sf'),dots(2,'sf'),'?']),vo:[dots(3,'so'),dots(2,'sf'),dots(3,'cf'),dots(4,'sf'),dots(3,'sf'),dots(3,'co')],a:4},
 {id:'q9',c:'Numérico',w:2,q:'Que número vem a seguir? 1, 1, 2, 3, 5, __',o:['6','7','8','9','10'],a:2,fix:1},
 {id:'v2',c:'Visual',w:2,q:'Escolhe a peça que completa o padrão.',viz:()=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:220px;margin:auto;color:var(--ink)">${shp('c',1)}${shp('c',0)}${shp('s',1)}<div style="border:2.5px solid #1C73E8;border-radius:8px;display:grid;place-items:center;font-size:34px;font-weight:800;color:#1C73E8">?</div></div>`,vo:[shp('s',0),shp('c',1),shp('s',1),shp('c',0),shp('s',1,90),shp('t',0)],a:0},
 {id:'q10',c:'Numérico',w:2,q:'Descobre o valor do círculo.',viz:()=>eq([TRI+P+TRI+E+'<span>10</span>',CIR+P+TRI+E+'<span>8</span>'],CIR+E+Q),o:['2','3','4','5'],a:1,fix:1},
 {id:'v3',c:'Visual',w:3,q:'Qual carta falta?',viz:()=>matrix([sym('d','plain'),sym('h','plain'),sym('s','plain'),sym('d','out'),sym('h','out'),sym('s','out'),sym('d','fill'),'?',sym('s','fill')]),vo:[sym('h','out'),sym('d','fill'),sym('s','fill'),sym('h','fill'),sym('s','plain'),sym('h','plain')],a:3},
 {id:'q11',c:'Numérico',w:3,q:'Que número vem a seguir? 2, 6, 12, 20, 30, __',o:['36','40','42','44','48'],a:2,fix:1},
 {id:'q12',c:'Lógica',w:3,q:'Se 5 máquinas fazem 5 peças em 5 minutos, quantos minutos demoram 100 máquinas a fazer 100 peças?',o:['1','5','20','100'],a:1,fix:1},
 {id:'q13',c:'Numérico',w:3,q:'Que número vem a seguir? 5, 11, 23, 47, __',o:['85','91','95','99','105'],a:2,fix:1},
 {id:'n1',c:'Numérico',w:3,q:'Que número vem a seguir? 3, 5, 9, 17, 33, __',o:['49','57','65','66','69'],a:2,fix:1},
 {id:'l1',c:'Lógica',w:3,q:'Num código secreto, RIO = QHN. Como se escreve SOL?',o:['RNK','TPM','RMK','RNL','QNK'],a:0},
 {id:'ve1',c:'Verbal',w:3,q:'Livro está para leitor assim como música está para…',o:['Compositor','Ouvinte','Instrumento','Concerto'],a:1},
 {id:'ve2',c:'Verbal',w:3,q:'Quente está para frio assim como expandir está para…',o:['Crescer','Contrair','Esticar','Aumentar'],a:1},
 {id:'ve3',c:'Verbal',w:3,q:'Qual palavra não pertence ao grupo? Tigre, leão, leopardo, lobo, chita',o:['Tigre','Leão','Lobo','Chita','Leopardo'],a:2},
 {id:'n2',c:'Numérico',w:4,q:'Que número vem a seguir? 1, 2, 6, 24, 120, __',o:['240','360','600','720','840'],a:3,fix:1},
 {id:'n3',c:'Numérico',w:4,q:'Que número vem a seguir? 2, 5, 11, 20, 32, __',o:['44','45','47','48','50'],a:2,fix:1},
 {id:'n5',c:'Numérico',w:4,q:'Vais de A a B a 60 km/h e regressas pelo mesmo caminho a 40 km/h. Qual é a velocidade média em todo o percurso?',o:['45 km/h','48 km/h','50 km/h','52 km/h'],a:1,fix:1},
 {id:'n6',c:'Numérico',w:4,q:'Numa turma, 60% são raparigas. Usam óculos 25% das raparigas e 50% dos rapazes. Que percentagem da turma usa óculos?',o:['30%','35%','37,5%','40%'],a:1,fix:1},
 {id:'l2',c:'Lógica',w:4,q:'Cinco amigos estão numa fila. O Rui está depois da Eva e antes do Hugo. A Ana está logo a seguir ao Hugo. O Tomás é o primeiro. Quem está em quarto lugar?',o:['Rui','Hugo','Ana','Eva'],a:1},
 {id:'l3',c:'Lógica',w:4,q:'Todos os bloops são razzies. Alguns razzies são lazzies. Qual conclusão é necessariamente verdadeira?',o:['Todos os bloops são lazzies','Alguns bloops são lazzies','Nenhuma das outras é necessariamente verdadeira','Nenhum bloop é lazzie'],a:2},
 {id:'l4',c:'Lógica',w:4,q:'Qual é a letra seguinte? A, C, F, J, O, __',o:['S','T','U','V'],a:2,fix:1},
 {id:'ve4',c:'Verbal',w:4,q:'Termómetro está para temperatura assim como…',o:['Régua : centímetro','Barómetro : pressão','Bússola : mapa','Microscópio : célula'],a:1},
 {id:'ve5',c:'Verbal',w:4,q:'Qual palavra tem o significado mais próximo de «efémero»?',o:['Eterno','Passageiro','Frágil','Antigo'],a:1},
 {id:'v4',c:'Visual',w:4,q:'Que célula completa a matriz?',viz:()=>matrix([dots(1,'cf'),dots(2,'co'),dots(3,'sf'),dots(2,'cf'),dots(3,'co'),dots(1,'sf'),dots(3,'cf'),dots(1,'co'),'?']),vo:[dots(2,'sf'),dots(2,'so'),dots(1,'sf'),dots(3,'sf'),dots(2,'cf'),dots(2,'co')],a:0},
 {id:'n4',c:'Numérico',w:5,q:'Que número vem a seguir? 2, 12, 36, 80, 150, __',o:['210','240','252','264','288'],a:2,fix:1},
 {id:'n7',c:'Numérico',w:5,q:'Lançam-se dois dados. Qual é a probabilidade de a soma ser 8?',o:['1/6','5/36','1/9','7/36','1/12'],a:1,fix:1},
 {id:'l5',c:'Lógica',w:5,q:'Numa ilha, os cavaleiros dizem sempre a verdade e os patifes mentem sempre. O A diz: «Nós os dois somos patifes.» O que são A e B?',o:['A cavaleiro, B patife','A patife, B cavaleiro','Ambos patifes','Ambos cavaleiros'],a:1,fix:1},
 {id:'v5',c:'Visual',w:5,q:'Qual a figura que completa a matriz? Cada linha segue uma regra.',viz:()=>matrix([dots(1,'cf'),dots(1,'cf'),dots(2,'cf'),dots(1,'co'),dots(2,'co'),dots(3,'co'),dots(2,'sf'),dots(1,'sf'),'?']),vo:[dots(3,'sf'),dots(3,'so'),dots(2,'sf'),dots(1,'sf'),dots(3,'cf'),dots(2,'so')],a:0},
 {id:'v6',c:'Visual',w:5,q:'Que peça completa a matriz?',viz:()=>matrix([shp('c',1,0),shp('c',1,90),shp('c',1,180),shp('s',1,0),shp('s',1,90),shp('s',1,180),shp('t',1,0),shp('t',1,90),'?']),vo:[shp('t',1,180),shp('t',1,270),shp('t',1,90),shp('s',1,180),shp('c',1,180),shp('t',0,0)],a:0},
 {id:'word',c:'Memória',w:2,q:'Que palavra te pedimos para memorizar no início?',o:['Esperto','QI','Cérebro','Cognitivo','Inteligência'],a:3,fix:1}
];

/* ---------- banco alargado: geradores aleatórios + perguntas extra ---------- */
let K=0;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), PK=a=>a[Math.floor(Math.random()*a.length)];
const add=(c,w,gen,n=1)=>{for(let i=0;i<n;i++)BANK.push({id:'g'+(K++),c,w,gen})};
const T=(c,w,q,o,a,fix)=>BANK.push({id:'h'+(K++),c,w,q,o,a,...(fix?{fix:1}:{})});
const numQ=(q,ans,ws,u='',x={})=>{const w=[...new Set(ws.concat([ans+1,ans-1,ans+3,ans-2,ans+7]).filter(v=>v!==ans))].slice(0,4);const t=[ans,...w].sort((m,n)=>m-n);return {q,o:t.map(v=>v+u),a:t.indexOf(ans),fix:1,...x}};
const seqQ=(a,ans,ws)=>numQ('Que número vem a seguir? '+a.join(', ')+', __',ans,ws);
const gAr=()=>{const d=R(3,9),a=R(2,20),s=[...Array(6)].map((_,i)=>a+d*i);return seqQ(s.slice(0,5),s[5],[s[5]+d,s[4]+d-1])};
const gGeo=()=>{const r=PK([2,3]),a=R(1,4),s=[...Array(6)].map((_,i)=>a*r**i);return seqQ(s.slice(0,5),s[5],[s[5]+r,s[4]*(r+1)])};
const gQuad=()=>{const a=R(1,5),d=R(2,4),e=R(1,3),s=[a];for(let k=0;k<5;k++)s.push(s[k]+d+e*k);return seqQ(s.slice(0,5),s[5],[s[4]+(s[4]-s[3]),s[5]+e])};
const gAlt=()=>{const a=R(1,6),d=R(2,5),b=R(20,30),e=R(2,4),s=[...Array(8)].map((_,i)=>i%2?b-e*((i-1)/2):a+d*(i/2));return seqQ(s.slice(0,7),s[7],[s[7]+e,s[6]+d])};
const gSpan=(n,rev)=>{const dg=shuffle([1,2,3,4,5,6,7,8,9,0]).slice(0,n).join(''),ok=rev?[...dg].reverse().join(''):dg;
  const sw=(t,i)=>{const a=[...t];[a[i],a[i+1]]=[a[i+1],a[i]];return a.join('')};
  const d=new Set();if(rev)d.add(dg);shuffle([...Array(n-1).keys()]).forEach(i=>d.add(sw(ok,i)));d.delete(ok);
  const o=shuffle([ok,...[...d].slice(0,3)]);return {span:dg,rev,o,a:o.indexOf(ok)}};
const gSym2=()=>{const x=R(2,9),y=R(1,9);return numQ('Descobre o valor do triângulo.',y,[x,x+y],'',{viz:()=>eq([CIR+P+CIR+E+`<span>${2*x}</span>`,CIR+P+TRI+E+`<span>${x+y}</span>`],TRI+E+Q)})};
const gSym2b=()=>{const x=R(2,6),y=R(1,8);return numQ('Descobre o valor do triângulo.',y,[x,x+y],'',{viz:()=>eq([CIR+P+CIR+P+CIR+E+`<span>${3*x}</span>`,CIR+P+TRI+P+TRI+E+`<span>${x+2*y}</span>`],TRI+E+Q)})};
const gSym3=()=>{const x=R(1,8),y=R(2,9),z=R(3,9);return numQ('Descobre o valor da soma pedida.',x+y+z,[x+y,y+z,x+z],'',{viz:()=>eq([CIR+P+SQU+E+`<span>${x+y}</span>`,SQU+P+TRI+E+`<span>${y+z}</span>`,CIR+P+TRI+E+`<span>${x+z}</span>`],CIR+P+SQU+P+TRI+E+Q)})};
const gLet=d0=>{const p=R(0,2),pos=[p];let df=d0;for(let i=0;i<5;i++){pos.push(pos[i]+df);df++}
  const L=n=>String.fromCharCode(65+n),an=pos[5],o=[...new Set([an,an+1,an-1,an+2,an-2].filter(v=>v>=0&&v<26))].slice(0,4).sort((m,n)=>m-n);
  return {q:'Qual é a letra seguinte? '+pos.slice(0,5).map(L).join(', ')+', __',o:o.map(L),a:o.indexOf(an),fix:1}};
const enc=(w,k)=>[...w].map(c=>String.fromCharCode((c.charCodeAt(0)-65+k+26)%26+65)).join('');
const gCode=()=>{const W=['SOL','RIO','LUA','MAR','CAL'],k=PK([1,2,3,-1,-2,-3]),ex=PK(W),tg=PK(W.filter(x=>x!==ex)),an=enc(tg,k);
  const w=[...new Set([enc(tg,-k),enc(tg,k+1),enc(tg,k-1),enc(tg,k+2)])].filter(v=>v!==an).slice(0,4);
  return {q:`Num código secreto, ${ex} = ${enc(ex,k)}. Como se escreve ${tg}?`,o:[an,...w],a:0}};
const gLatin=()=>{const st=shuffle(['cf','co','sf','so']).slice(0,3),cn=shuffle([1,2,3]),cells=[];

/* ---------- Teste ---------- */
function begin(key){
  const nm=($('#name')||{}).value;
  if(nm!=null){S.name=nm.trim();store.set('name',S.name)}
  const g=GROUPS[key];
  const pool=BANK.filter(q=>!g.cats||g.cats.includes(q.c)), wq=pool.find(q=>q.id==='word'), rest=pool.filter(q=>q.id!=='word');
  let list=[];
  if(key==='all'){const Qt={1:6,2:7,3:9,4:10,5:7};for(const w in Qt)list.push(...shuffle(rest.filter(q=>q.w==w)).slice(0,Qt[w]))}
  else list=shuffle(rest).slice(0,wq?11:12);
  if(wq)list.push(wq);
  list=list.map(q=>q.gen?{...q,...q.gen()}:q).sort((a,b)=>(a.id==='word')-(b.id==='word')||a.w-b.w);
  if(key==='all'){const lk=shuffle(LKQ).slice(0,3);[3,14,26].forEach((p,i)=>list.splice(p,0,lk[i]));list.push(AGE,EDU)}
  list=list.map(q=>{
    if(q.span||q.fix||!q.o&&!q.vo)return {...q,order:(q.o||q.vo).map((_,i)=>i)};
    return {...q,order:shuffle((q.o||q.vo).map((_,i)=>i))};
  });
  S.run={key,list,withWord:list.some(q=>q.id==='word')};
  S.i=0;S.ans=[];S.tab='run';S.t0=Date.now();mark('teste_iniciado');
  go(()=>{ renderNav(); S.run.withWord?wordScreen():show(); startTimer(); });
}

function finish(){mark('teste_concluido');
  clearInterval(S.tick);
  const r=S.run, secs=Math.floor((Date.now()-S.t0)/1000);
  const tot=r.list.reduce((a,q)=>a+q.w,0), got=r.list.reduce((a,q,i)=>a+(S.ans[i]?q.w:0),0);
  const w=got/tot, iq=Math.round(70+75*w);
  const cats={};
  r.list.forEach((q,i)=>{if(!q.w)return;const c=cats[q.c]||(cats[q.c]={g:0,t:0});c.t+=q.w;if(S.ans[i])c.g+=q.w});
  const catPct={};Object.keys(cats).forEach(k=>catPct[k]=Math.round(cats[k].g/cats[k].t*100));
  const prev=store.get('last')||{};
  const groups={...(prev.groups||{})};groups[r.key]=Math.round(w*100);
  const res={key:r.key,iq,pct:Math.round(w*100),cats:catPct,secs,correct:S.ans.filter(Boolean).length,total:r.list.filter(q=>q.w).length,date:Date.now(),groups};
  if(r.key==='all')store.set('last',{...res});else store.set('last',{...prev,groups,mod:res});

  ${sec('04','Onde as tuas forças valem mais',`<p style="margin-top:4px">Com <b>${top[0]}</b> em destaque, tens vantagem em:</p><div class="rp-chips">${REPC[top[0]].map(t=>`<span>${t}</span>`).join('')}</div>${rows[1]?`<p>A tua segunda força, <b>${rows[1][0]}</b>, reforça-te em:</p><div class="rp-chips">${REPC[rows[1][0]].slice(0,2).map(t=>`<span>${t}</span>`).join('')}</div>`:''}`)}
  ${sec('05','Plano de 7 dias · '+low[0],`<ol class="rp-tl">${REPP[low[0]].map((t,i)=>`<li data-d="${i+1}">${t}</li>`).join('')}</ol>${gk?`<button class="cta" data-start="${gk}" style="margin-top:6px">Treinar ${low[0]} agora</button>`:''}`)}
  <div class="rp-ft">Relatório N.º ${certNo(r)} · ${certDate(r)}<br>Relatório de carácter informativo, baseado nas tuas respostas. Não constitui diagnóstico.</div>`;
}
function certCard(r){
  const d=!!store.get('cert'),nm=store.get('certName')||S.name;
  return `<div class="card-viz" style="margin-top:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>O teu certificado</b>${d?'<span class="rp-e1" style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px">✓ Desbloqueado</span>':''}</div>${certSVG(r,nm,!d)}${d?'<button class="cta" data-certdl style="margin-top:16px">Descarregar certificado</button><p class="pay-msg" id="rcm"></p><button class="cta ghost" data-cert style="margin-top:8px">Ver em ecrã inteiro</button>':`<p style="margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.5">Com o teu nome, a tua pontuação e um número único, para guardares e partilhares. ${esc(CERT.price)}, pagamento único.</p><button class="cta" data-cert style="margin-top:14px">Quero o meu certificado · ${esc(CERT.price)}</button>`}</div>`;
}
function repTeaser(r){
  const rows=repRows(r);if(!rows.length)return'';
  const done=!!store.get('rep'),h=repHead(r);
  if(done)return `<div class="rp-hero" style="padding:22px 20px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="rp-k">PERFIL COGNITIVO</span><span style="white-space:nowrap;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(127,127,127,.3)">✓ Desbloqueado</span></div><div class="rp-ar" style="font-size:30px;margin-top:14px">${h.name}</div><p class="rp-tx" style="font-size:14px">${h.txt}</p><button class="cta" data-rep style="margin-top:18px;background:var(--on-dark);color:var(--dark)">Abrir relatório completo</button></div>`;
  return `<div class="card-viz" style="margin-top:20px"><div style="font-weight:700;margin-bottom:10px">Relatório do teu perfil cognitivo</div>
  <p style="margin:0 0 10px;line-height:1.5">O teu perfil: <b>${h.name}</b></p>
  ${done?'':`<p style="margin:0 0 6px;color:var(--muted)">🔒 Mapa cognitivo e comparação entre áreas</p><p style="margin:0 0 6px;color:var(--muted)">🔒 O teu ritmo e a tua precisão</p><p style="margin:0 0 6px;color:var(--muted)">🔒 Onde as tuas forças valem mais</p><p style="margin:0 0 4px;color:var(--muted)">🔒 Plano de 7 dias para a tua área mais fraca</p>`}
  <button class="cta" data-rep style="margin-top:14px">${done?'Ver o meu relatório':'Quero o meu relatório · '+esc(REP.price)}</button></div>`;
}
function repScreen(res){
  const top=`<div class="top"><div class="brand"><div class="avatar" aria-hidden="true">${LOGOA}</div><span class="bn">Meu <b>QI</b></span></div></div>`;
  const bk='<button class="cta ghost" id="rback" style="margin-top:12px">Voltar ao resultado</button>';
  const back=()=>app.querySelector('#rback').addEventListener('click',()=>go(()=>results(res,false)));
  if(store.get('rep')){app.innerHTML=`<section class="screen eg">${top}${repBody(res)}${bk}</section>`;back();return}
  const ms=[['M-Pesa',PAY.mpesa],['e-Mola',PAY.emola]].filter(m=>m[1]);let cur=0;
  app.innerHTML=`<section class="screen eg">${top}<h1 class="eg-t" style="margin-top:28px">Relatório do teu <b>perfil cognitivo</b></h1>
   <p class="eg-p" style="margin-top:14px">Descobre o teu perfil, o teu ritmo e a tua precisão, onde as tuas forças valem mais e um plano de 7 dias para a tua área mais fraca. <b>${esc(REP.price)}</b>, pagamento único.</p>
   ${ms.length>1?`<div class="pay-tabs">${ms.map((m,i)=>`<button data-pm="${i}" class="${i?'':'on'}">${m[0]}</button>`).join('')}</div>`:''}
   <ol class="pay-steps" id="pst"></ol>
   <input class="eg-in" id="ptel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Número com que pagaste" aria-label="Número com que pagaste" style="margin-top:20px;padding:18px 24px;font-size:18px">
   <input class="eg-in" id="pref" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Referência da transação" aria-label="Referência da transação" style="margin-top:12px;padding:18px 24px;font-size:18px">
   <button class="eg-b" id="pgo" disabled>Já paguei</button><p class="pay-msg" id="pmsg"></p>
   <div class="pay-sep">Já tens um código?</div>
   <input class="eg-in" id="pcode" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="RL-XXXX-XXXX" aria-label="Código" style="margin-top:14px;padding:18px 24px;font-size:18px">
   <button class="eg-b" id="pcb" disabled>Desbloquear</button><p class="pay-msg" id="pcm"></p>${bk}</section>`;
  const steps=()=>{const m=ms[cur];$('#pst').innerHTML=`<li>Abre o ${m[0]} e envia <b>${esc(REP.price)}</b> para <b>${esc(m[1])}</b>${PAY.name?' ('+esc(PAY.name)+')':''}.</li><li>Escreve abaixo o número com que pagaste e a referência da mensagem de confirmação.</li><li>Carrega em "Já paguei". Confirmamos o pagamento e enviamos-te um código por e-mail.</li>`};steps();
  const tel=$('#ptel'),ref=$('#pref'),go_=$('#pgo'),code=$('#pcode'),cb=$('#pcb');
  const sync=()=>{go_.disabled=!(tel.value.replace(/\D/g,'').length>=9&&ref.value.trim().length>=4);cb.disabled=code.value.trim().length<6};
  [tel,ref,code].forEach(e=>e.addEventListener('input',sync));
  app.querySelectorAll('[data-pm]').forEach(b=>b.addEventListener('click',()=>{cur=+b.dataset.pm;app.querySelectorAll('[data-pm]').forEach(x=>x.classList.toggle('on',x===b));steps()}));
  go_.addEventListener('click',()=>{go_.disabled=true;const m=$('#pmsg');m.className='pay-msg';m.textContent='A enviar…';
    sendPay({subject:'Pedido de relatório — Meu QI',produto:'Relatório de perfil cognitivo',email:store.get('email')||'',qi:String(res.iq),metodo:ms[cur][0],valor:REP.price,telefone:tel.value.trim(),referencia:ref.value.trim()}).then(ok=>{
      if(ok){track('AddPaymentInfo');m.textContent='Recebemos o teu pedido. Vamos confirmar o pagamento e enviar-te um código para '+(store.get('email')||'o teu e-mail')+'. Quando o receberes, escreve-o acima.'}
      else{m.className='pay-msg err';m.textContent='Não foi possível enviar. Verifica a ligação e tenta outra vez.';sync()}});});
  cb.addEventListener('click',()=>{const m=$('#pcm');
    if(repOk(code.value)){track('Purchase',{value:parseFloat(REP.price),currency:'MZN',content_name:'Relatório'});store.set('rep',true);go(()=>repScreen(res))}
    else{m.className='pay-msg err';m.textContent='Código inválido. Confirma se o escreveste como o recebeste.'}});
  back();
}
function resultsTab(){
  const last=store.get('last');
  if(!last||!last.iq){
    S.tab='results';
    app.innerHTML=`<section class="screen"><div class="top"><div class="avatar" aria-hidden="true">${LOGO}</div></div>
      <div class="empty"><h2>Ainda sem resultados</h2><p>Faz o teste completo para ver a tua estimativa de QI e o desempenho por área.</p>
      <button class="cta" data-start="all">Começar o teste</button></div></section>`;
    renderNav();return;
  }
  results(last,false);renderNav();
}

/* ---------- sheet ---------- */
function sheet(on){
  const s=$('#sheet'),v=$('#veil');
  if(on){
    s.innerHTML=`<h3>Sobre o Meu QI</h3><p>O Meu QI mede raciocínio lógico, numérico, verbal, memória e percepção visual com perguntas de dificuldade crescente. Cada teste sorteia perguntas diferentes de um banco alargado. O resultado é uma estimativa para entretenimento e autoconhecimento. Não é um diagnóstico nem substitui uma avaliação feita por um psicólogo.</p><button class="cta" data-close>Fechar</button>`;
    v.style.display='block';requestAnimationFrame(()=>s.classList.add('on'));
  }else{s.classList.remove('on');setTimeout(()=>v.style.display='none',420)}
}

/* ---------- eventos ---------- */
{const p=store.get('emailPending');if(p&&p.email)sendEmail(p.email,p.qi).then(ok=>{if(ok)store.set('emailPending',null)})}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-start],[data-begin],[data-begin-direct],[data-ans],[data-word],[data-next],[data-about],[data-close],[data-share],[data-exit],[data-xno],[data-xyes],#veil');
  if(!t)return;
  if(t.dataset.nav){
    const k=t.dataset.nav; if(k===S.tab||S.busy)return;
    go(()=>{ if(k==='home')home(); else if(k==='start')intro('all'),renderNav(); else resultsTab(); });
  }
  else if(t.dataset.start){go(()=>{intro(t.dataset.start)})}
  else if(t.dataset.begin){S.gender=t.dataset.g||'';begin(t.dataset.begin)}
  else if(t.dataset.beginDirect){S.name=S.name;begin(t.dataset.beginDirect)}
  else if(t.dataset.ans!=null){answer(+t.dataset.ans,t)}
  else if(t.dataset.word!=null){swap(show)}
  else if(t.dataset.next!=null){swap(show)}
  else if(t.dataset.exit!=null){exitAsk()}
  else if(t.dataset.xno!=null){exitClose(true)}
  else if(t.dataset.xyes!=null){exitClose(false);clearInterval(S.tick);S.run=null;go(()=>{home();renderNav()})}
  else if(t.dataset.about!=null){sheet(true)}
  else if(t.dataset.close!=null||t.id==='veil'){sheet(false)}
  else if(t.dataset.share!=null){
    const l=store.get('last');
    const text=`Fiz o teste Meu QI e a minha estimativa de QI foi ${l.iq} (${band(l.iq)}).`;
    if(navigator.share){navigator.share({title:'Meu QI — Teste de raciocínio',text}).catch(()=>{})}
    else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>{t.textContent='Copiado'}).catch(()=>{})}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){sheet(false);if($('#xv'))exitClose(true)}});

home();
</script>
</body>
</html>
